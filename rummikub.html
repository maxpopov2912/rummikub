                // Очищаем выделение после успешного перемещения
                this.selectedTiles = [];
                this.render();
            }

            removeTileFromGrid(row, col) {
                if (this.boardGrid[row][col] === null) return;

                if (!this.turnState) {
                    this.turnState = {
                        hand: [...this.playerHand],
                        board: this.boardGrid.map(r => [...r])
                    };
                }

                const tile = this.boardGrid[row][col];
                this.boardGrid[row][col] = null;
                this.playerHand.push(tile);
                this.sortHand();
                this.render();
            }

            getBoardSets() {
                const sets = [];
                
                // Проверяем горизонтальные ряды
                for (let row = 0; row < 7; row++) {
                    let currentSet = [];
                    for (let col = 0; col < 21; col++) {
                        if (this.boardGrid[row][col] !== null) {
                            currentSet.push(this.boardGrid[row][col]);
                        } else if (currentSet.length > 0) {
                            sets.push([...currentSet]);
                            currentSet = [];
                        }
                    }
                    if (currentSet.length > 0) {
                        sets.push(currentSet);
                    }
                }
                
                return sets;
            }

            validateSet(tiles) {
                if (tiles.length < 3) return false;

                // Проверка на группу (одинаковые числа, разные цвета)
                const isGroup = this.isValidGroup(tiles);
                
                // Проверка на последовательность (одинаковый цвет, последовательные числа)
                const isRun = this.isValidRun(tiles);

                return isGroup || isRun;
            }

            isValidGroup(tiles) {
                const nonJokerTiles = tiles.filter(t => !t.isJoker);
                if (nonJokerTiles.length === 0) return false;

                const number = nonJokerTiles[0].number;
                const colors = new Set();

                for (let tile of nonJokerTiles) {
                    if (tile.number !== number) return false;
                    if (colors.has(tile.color)) return false;
                    colors.add(tile.color);
                }

                return tiles.length >= 3 && tiles.length <= 4;
            }

            isValidRun(tiles) {
                if (tiles.length < 3) return false;
                
                const nonJokerTiles = tiles.filter(t => !t.isJoker);
                if (nonJokerTiles.length === 0) return false;

                // Все не-джокерные плитки должны быть одного цвета
                const color = nonJokerTiles[0].color;
                for (let tile of nonJokerTiles) {
                    if (tile.color !== color) return false;
                }

                // Сортируем не-джокерные плитки по номеру
                const sortedNonJokers = [...nonJokerTiles].sort((a, b) => a.number - b.number);
                
                // Проверяем что можем заполнить пропуски джокерами
                const jokerCount = tiles.length - nonJokerTiles.length;
                let jokersNeeded = 0;
                
                for (let i = 0; i < sortedNonJokers.length - 1; i++) {
                    const gap = sortedNonJokers[i + 1].number - sortedNonJokers[i].number - 1;
                    if (gap < 0) return false; // Дубликат числа
                    jokersNeeded += gap;
                }
                
                // Проверяем что джокеров достаточно для заполнения всех пропусков
                if (jokersNeeded > jokerCount) return false;
                
                // Проверяем что последовательность не выходит за границы (1-13)
                const minNumber = sortedNonJokers[0].number;
                const maxNumber = sortedNonJokers[sortedNonJokers.length - 1].number;
                const totalSpan = maxNumber - minNumber + 1;
                
                // Общая длина последовательности должна совпадать с количеством плиток
                if (totalSpan !== tiles.length) {
                    // Джокеры могут быть в начале или конце
                    const extraJokers = jokerCount - jokersNeeded;
                    // Проверяем что можем добавить джокеров в начало/конец без выхода за 1-13
                    if (minNumber - extraJokers < 1 && maxNumber + extraJokers > 13) {
                        return false;
                    }
                }

                return true;
            }

            calculateSetValue(tiles) {
                return tiles.reduce((sum, tile) => sum + (tile.isJoker ? 0 : tile.number), 0);
            }

            endTurn() {
                if (this.currentPlayer !== 'player') return;
                
                // Проверяем что игрок что-то выложил (turnState существует)
                if (!this.turnState) {
                    this.showMessage('❌ Сначала выложите плитки или возьмите плитку из стопки!', 'error');
                    return;
                }
                
                const sets = this.getBoardSets();

                // Валидация всех рядов на доске
                let allValid = true;
                let totalValue = 0;

                for (let set of sets) {
                    if (!this.validateSet(set)) {
                        this.showMessage('Один или несколько рядов на поле некорректны!', 'error');
                        allValid = false;
                        break;
                    }
                    totalValue += this.calculateSetValue(set);
                }

                if (!allValid) return;

                // Проверка первого выкладывания
                if (!this.firstMeldMade.player && sets.length > 0) {
                    if (totalValue < 30) {
                        this.showMessage('Для первого хода нужно выложить плитки на сумму минимум 30 очков!', 'error');
                        return;
                    }
                    this.firstMeldMade.player = true;
                    this.showMessage('Отличный первый ход! Теперь можно выкладывать любые комбинации.', 'success');
                }

                // Проверка победы
                if (this.playerHand.length === 0) {
                    this.showMessage('🎉 Поздравляем! Вы выиграли! 🎉', 'success');
                    return;
                }

                this.turnState = null;
                this.showMessage('Ход завершен!', 'success');
                
                setTimeout(() => this.switchTurn(), 1000);
            }

            undoMove() {
                if (this.turnState) {
                    this.playerHand = [...this.turnState.hand];
                    this.boardGrid = this.turnState.board.map(r => [...r]);
                    this.turnState = null;
                    this.selectedTiles = [];
                    this.showMessage('Ход отменен', 'info');
                    this.render();
                } else {
                    this.showMessage('Нечего отменять', 'info');
                }
            }

            newGame() {
                console.log('Starting new game...');
                
                // Полный сброс всех переменных
                this.pool = [];
                this.playerHand = [];
                this.computerHands = [];
                for (let i = 0; i < this.computerCount; i++) {
                    this.computerHands.push([]);
                }
                this.computerNames = this.generateComputerNames(); // Новые имена
                this.boardGrid = Array(7).fill(null).map(() => Array(21).fill(null));
                this.selectedTiles = [];
                this.firstMeldMade = { player: false, computer1: false, computer2: false, computer3: false };
                this.turnState = null;
                this.currentPlayer = 'player';
                
                console.log('Variables reset');
                
                // Создаём новые плитки и раздаём их
                this.createTiles();
                console.log('Tiles created:', this.pool.length);
                
                this.shufflePool();
                console.log('Pool shuffled');
                
                this.dealInitialTiles();
                console.log('Tiles dealt - Player:', this.playerHand.length, 'Computers:', this.computerHands.map(h => h.length), 'Pool:', this.pool.length);
                
                // Перерисовываем всё
                this.render();
                console.log('Rendered');
                
                this.showMessage('Новая игра начата! Удачи!', 'success');
            }

            showMessage(text, type = 'info') {
                const messageEl = document.getElementById('message');
                messageEl.textContent = text;
                messageEl.className = `message ${type}`;
                messageEl.style.display = 'block';
                
                setTimeout(() => {
                    messageEl.style.display = 'none';
                }, 3000);
            }

            renderTile(tile, location) {
                const div = this.createTileElement(tile);
                div.draggable = true;
                
                const isSelected = this.selectedTiles.some(t => t.tileId === tile.id);
                if (isSelected) {
                    div.classList.add('selected');
                }
                
                // Drag and drop события
                div.addEventListener('dragstart', (e) => {
                    e.dataTransfer.effectAllowed = 'move';
                    
                    // Если плитка не выбрана, выбираем только её (но не перерисовываем сразу)
                    if (!isSelected) {
                        this.selectedTiles = [{ tileId: tile.id, location }];
                    }
                    
                    // Передаём информацию о всех выбранных плитках
                    const selectedData = this.selectedTiles.map(t => ({
                        tileId: t.tileId,
                        location: t.location
                    }));
                    e.dataTransfer.setData('selectedTiles', JSON.stringify(selectedData));
                    
                    // Создаём визуальное представление всех перемещаемых плиток
                    const dragContainer = document.createElement('div');
                    dragContainer.style.position = 'absolute';
                    dragContainer.style.top = '-10000px';
                    dragContainer.style.display = 'flex';
                    dragContainer.style.gap = '5px';
                    dragContainer.style.background = 'transparent';
                    
                    // Добавляем визуальные копии всех выбранных плиток
                    for (let selectedTile of this.selectedTiles) {
                        let tileObj = null;
                        
                        if (selectedTile.location === 'hand') {
                            tileObj = this.playerHand.find(t => t.id === selectedTile.tileId);
                        } else if (selectedTile.location.startsWith('grid-')) {
                            const [row, col] = selectedTile.location.split('-').slice(1).map(Number);
                            tileObj = this.boardGrid[row][col];
                        }
                        
                        if (tileObj) {
                            const tileClone = this.createTileElement(tileObj);
                            tileClone.style.opacity = '0.9';
                            dragContainer.appendChild(tileClone);
                        }
                    }
                    
                    document.body.appendChild(dragContainer);
                    e.dataTransfer.setDragImage(dragContainer, 0, 0);
                    
                    // Удаляем временный контейнер после начала перетаскивания
                    setTimeout(() => {
                        document.body.removeChild(dragContainer);
                    }, 0);
                    
                    div.classList.add('dragging');
                });
                
                div.addEventListener('dragend', (e) => {
                    div.classList.remove('dragging');
                });
                
                // Оставляем клик для выделения
                div.onclick = () => this.selectTile(tile.id, location);
                
                return div;
            }

            createTileElement(tile) {
                const div = document.createElement('div');
                div.className = `tile ${tile.color}`;
                
                if (!tile.isJoker) {
                    div.setAttribute('data-number', tile.number);
                } else {
                    // Джокер отображается через CSS ::before
                }
                
                return div;
            }

            render() {
                // Обновляем информацию
                document.getElementById('pool-count').textContent = this.pool.length;
                document.getElementById('hand-count').textContent = this.playerHand.length;
                
                let currentPlayerText = 'Ваш ход ✓';
                if (this.currentPlayer.startsWith('computer')) {
                    const computerNum = parseInt(this.currentPlayer.replace('computer', '')) - 1;
                    currentPlayerText = `Ход: ${this.computerNames[computerNum]}`;
                }
                document.getElementById('current-player').textContent = currentPlayerText;
                document.getElementById('first-meld-status').textContent = 
                    this.firstMeldMade.player ? 'Выполнен ✓' : 'Требуется 30+ очков';

                // Рендерим стойки компьютеров
                const computerRacksContainer = document.getElementById('computer-racks-container');
                computerRacksContainer.innerHTML = '';
                
                for (let i = 0; i < this.computerCount; i++) {
                    const rackDiv = document.createElement('div');
                    rackDiv.className = 'player-rack';
                    
                    if (this.currentPlayer === `computer${i + 1}`) {
                        rackDiv.classList.add('active');
                    }
                    
                    const difficultyEmoji = {
                        'easy': '😊',
                        'medium': '🤔',
                        'hard': '😎'
                    };
                    
                    const difficultyText = {
                        'easy': 'лёгкий',
                        'medium': 'средний',
                        'hard': 'сложный'
                    };
                    
                    const difficulty = this.computerDifficulties[i] || 'easy';
                    
                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'rack-title';
                    titleDiv.textContent = `${difficultyEmoji[difficulty]} ${this.computerNames[i]}`;
                    titleDiv.title = `Уровень: ${difficultyText[difficulty]}`;
                    
                    const infoDiv = document.createElement('div');
                    infoDiv.className = 'computer-info';
                    
                    const countSpan = document.createElement('span');
                    countSpan.className = 'tile-count';
                    countSpan.textContent = `${this.computerHands[i].length} плиток`;
                    
                    infoDiv.appendChild(countSpan);
                    
                    rackDiv.appendChild(titleDiv);
                    rackDiv.appendChild(infoDiv);
                    computerRacksContainer.appendChild(rackDiv);
                }

                // Рендерим плитки игрока
                const handContainer = document.getElementById('player-tiles');
                handContainer.innerHTML = '';
                
                for (let tile of this.playerHand) {
                    handContainer.appendChild(this.renderTile(tile, 'hand'));
                }

                // Подсветка активного игрока
                const playerRack = document.querySelector('#player-tiles').parentElement;
                
                if (this.currentPlayer === 'player') {
                    playerRack.classList.add('active');
                } else {
                    playerRack.classList.remove('active');
                }

                // Рендерим сетку доски
                const gridContainer = document.getElementById('board-grid');
                gridContainer.innerHTML = '';
                
                for (let row = 0; row < 7; row++) {
                    for (let col = 0; col < 21; col++) {
                        const cell = document.createElement('div');
                        const cellInner = document.createElement('div');
                        cellInner.className = 'grid-cell-inner';
                        
                        if (this.boardGrid[row][col] !== null) {
                            const tile = this.boardGrid[row][col];
                            const tileEl = this.renderTile(tile, `grid-${row}-${col}`);
                            
                            // Добавляем контекстное меню для удаления (только для игрока)
                            if (this.currentPlayer === 'player') {
                                tileEl.oncontextmenu = (e) => {
                                    e.preventDefault();
                                    this.removeTileFromGrid(row, col);
                                };
                            }
                            
                            cellInner.appendChild(tileEl);
                            cell.appendChild(cellInner);
                            cell.className = 'grid-cell occupied';
                        } else {
                            cell.className = 'grid-cell';
                            cell.appendChild(cellInner);
                            
                            if (this.currentPlayer === 'player') {
                                cell.onclick = () => this.placeTileOnGrid(row, col);
                                
                                // Добавляем drag and drop обработчики
                                cell.addEventListener('dragover', (e) => {
                                    e.preventDefault();
                                    e.dataTransfer.dropEffect = 'move';
                                    cell.classList.add('drag-over');
                                });
                                
                                cell.addEventListener('dragleave', (e) => {
                                    cell.classList.remove('drag-over');
                                });
                                
                                cell.addEventListener('drop', (e) => {
                                    e.preventDefault();
                                    cell.classList.remove('drag-over');
                                    
                                    const selectedTilesData = e.dataTransfer.getData('selectedTiles');
                                    
                                    this.handleDrop(selectedTilesData, row, col);
                                });
                            }
                        }
                        
                        gridContainer.appendChild(cell);
                    }
                }
            }
        }

        // Инициализация игры
        const game = new RummikubGame();
    </script>
</body>
</html>
